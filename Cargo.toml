[workspace]
resolver = "3"
members = [
    "crates/lampo-domain",
    "crates/lampo-application",
    "crates/lampo-infra-fs",
    "crates/lampo-infra-store",
    "crates/lampo-infra-packages",
    "crates/lampo-infra-web",
    "crates/lampo-infra-services",
    "crates/lampo-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# Workspace crates
lampo-domain = { path = "crates/lampo-domain" }
lampo-application = { path = "crates/lampo-application" }
lampo-infra-fs = { path = "crates/lampo-infra-fs" }
lampo-infra-store = { path = "crates/lampo-infra-store" }
lampo-infra-packages = { path = "crates/lampo-infra-packages" }
lampo-infra-web = { path = "crates/lampo-infra-web" }
lampo-infra-services = { path = "crates/lampo-infra-services" }

# Shared third-party dependencies (keep versions here, crates opt in with `workspace = true`)
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Crates opt into the tokio features they need (tokio has no default features).
tokio = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
minijinja = "2"
clap = { version = "4", features = ["derive"] }
winreg = "0.55"
windows-sys = "0.59"
# TypeScript declarations of the DTOs (test-only: see lampo-application `ts_bindings`).
ts-rs = "12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The CLI shims run on every `php`/`composer` invocation: keep them small and fast.
[profile.release.package.lampo-cli]
opt-level = 3
