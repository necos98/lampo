[package]
name = "lampo-infra-store"
description = "Lampo local persistence adapters: TOML repositories, app paths, shim index, project detectors, git metadata, user PATH."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lampo-domain = { workspace = true }
lampo-infra-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = { workspace = true }
