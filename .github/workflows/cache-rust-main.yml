name: cache-rust-main

# Scalda la cache Rust per le build di release (build-windows.yml).
# Le cache salvate da un run su tag v* non sono ripristinabili da altri tag,
# mentre ogni run puo' ripristinare quelle del branch di default: per questo
# la cache viene prodotta qui, su main, con la stessa shared-key.
# Non crea Release ne' carica artifact.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - apps/desktop/src-tauri/Cargo.toml
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-cache:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build segnaposto del front-end
        # generate_context! di Tauri richiede che frontendDist (apps/desktop/build) esista:
        # per compilare le dipendenze basta una index.html vuota, niente pnpm.
        run: |
          New-Item -ItemType Directory -Force apps/desktop/build | Out-Null
          Set-Content -Path apps/desktop/build/index.html -Value '<!doctype html><title>cache</title>'

      - name: Build release (solo dipendenze/cache)
        # Tutto il workspace: app, CLI, shim e hosts helper (i sidecar di prepare-sidecars.ps1).
        run: cargo build --release --workspace
