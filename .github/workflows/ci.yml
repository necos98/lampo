name: ci

# Controlli di qualita' su ogni push a main e su ogni pull request:
# tipi del front-end (svelte-check), test node (versioni sincronizzate, config updater),
# formattazione (rustfmt), lint (clippy) e test del backend (cargo).
# Non produce eseguibili ne' Release (vedi build-windows.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Setup Rust (rust-toolchain.toml)
        # rustup e' preinstallato sul runner: installa versione e componenti (clippy, rustfmt)
        # fissati in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version

      - name: Format (rustfmt)
        # Stile in rustfmt.toml; non serve compilare, quindi fallisce subito.
        run: cargo fmt --all --check

      - name: Cache Rust
        # shared-key diversa da quella di release: qui si compila in profilo dev.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck (svelte-check)
        working-directory: apps/desktop
        run: pnpm check

      - name: Test (node)
        working-directory: apps/desktop
        run: pnpm test

      - name: Build frontend
        # generate_context! di Tauri richiede apps/desktop/build per compilare lampo-desktop.
        working-directory: apps/desktop
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (cargo)
        # I test che richiedono rete o binari reali sono #[ignore].
        run: cargo test --workspace --locked
