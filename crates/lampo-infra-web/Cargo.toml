[package]
name = "lampo-infra-web"
description = "Lampo web adapters: Apache config rendering/validation and runner (on the lampo-infra-services ServiceHost), php.ini rendering, hosts-file block and the optional Defender exclusions of the MySQL data and of the PHP/Apache servers, through their elevated helper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Tiny elevated helper: rewrites the Lampo block of the hosts file, or adds/removes the Defender
# exclusions of the MySQL data folder and of php-cgi.exe/httpd.exe. Started via UAC (`runas`).
name = "lampo-hosts-helper"
path = "src/bin/lampo-hosts-helper.rs"

[dependencies]
lampo-domain = { workspace = true }
lampo-infra-fs = { workspace = true }
lampo-infra-services = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
minijinja = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tempfile = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[dev-dependencies]
# The folder names and package paths the Defender exclusions hard-code must match the data and
# package layouts (two tests).
lampo-infra-packages = { workspace = true }
lampo-infra-store = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }
