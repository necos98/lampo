# Aggiornamenti settimanali delle dipendenze. Le action dei workflow sono fissate per SHA
# (commento = versione): Dependabot aggiorna SHA e commento insieme.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
