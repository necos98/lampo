# Generated by Lampo. Do not edit: changes are overwritten.
Define SRVROOT "C:/Lampo Data/packages/apache-2.4.62"
ServerRoot "${SRVROOT}"

# Vhost files to include. Lampo's validation wrapper defines it first to point `httpd -t` at
# the staged tree; otherwise it is the live tree.
<IfDefine !LAMPO_VHOSTS>
    Define LAMPO_VHOSTS "C:/Lampo Data/generated/apache/vhosts/*.conf"
</IfDefine>

# Loopback only: development sites are never exposed to the network.
Listen 127.0.0.1:80
Listen [::1]:80
Listen 127.0.0.1:8080
Listen 127.0.0.1:8101

LoadModule access_compat_module "${SRVROOT}/modules/mod_access_compat.so"
LoadModule alias_module "${SRVROOT}/modules/mod_alias.so"
LoadModule auth_basic_module "${SRVROOT}/modules/mod_auth_basic.so"
LoadModule authn_core_module "${SRVROOT}/modules/mod_authn_core.so"
LoadModule authn_file_module "${SRVROOT}/modules/mod_authn_file.so"
LoadModule authz_core_module "${SRVROOT}/modules/mod_authz_core.so"
LoadModule authz_groupfile_module "${SRVROOT}/modules/mod_authz_groupfile.so"
LoadModule authz_host_module "${SRVROOT}/modules/mod_authz_host.so"
LoadModule authz_user_module "${SRVROOT}/modules/mod_authz_user.so"
LoadModule autoindex_module "${SRVROOT}/modules/mod_autoindex.so"
LoadModule deflate_module "${SRVROOT}/modules/mod_deflate.so"
LoadModule dir_module "${SRVROOT}/modules/mod_dir.so"
LoadModule env_module "${SRVROOT}/modules/mod_env.so"
LoadModule expires_module "${SRVROOT}/modules/mod_expires.so"
LoadModule filter_module "${SRVROOT}/modules/mod_filter.so"
LoadModule headers_module "${SRVROOT}/modules/mod_headers.so"
LoadModule log_config_module "${SRVROOT}/modules/mod_log_config.so"
LoadModule mime_module "${SRVROOT}/modules/mod_mime.so"
LoadModule negotiation_module "${SRVROOT}/modules/mod_negotiation.so"
LoadModule rewrite_module "${SRVROOT}/modules/mod_rewrite.so"
LoadModule setenvif_module "${SRVROOT}/modules/mod_setenvif.so"
LoadModule version_module "${SRVROOT}/modules/mod_version.so"
LoadModule fcgid_module "C:/Lampo Data/packages/mod_fcgid-2.3.10/mod_fcgid.so"

ServerName localhost
UseCanonicalName Off
HostnameLookups Off
ServerTokens Prod
ServerSignature Off
PidFile "C:/Lampo Data/logs/apache/httpd.pid"
# Logs go through rotatelogs: a circular set of size-bounded files (error.log, error.log.1, …).
ErrorLog "||\"C:/Lampo Data/packages/apache-2.4.62/bin/rotatelogs.exe\" -n 3 \"C:/Lampo Data/logs/apache/error.log\" 10M"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" lampo

# Windows: no AcceptEx (breaks with some firewalls/VPN clients); no sendfile/mmap so files
# edited on shares or by VMs are never served stale.
AcceptFilter http none
AcceptFilter https none
EnableSendfile Off
EnableMMAP Off
ThreadsPerChild 64
MaxConnectionsPerChild 0
Timeout 300
KeepAlive On
KeepAliveTimeout 5
# Large uploads are allowed (FcgidMaxRequestLen is the effective limit for PHP).
LimitRequestBody 0

TypesConfig "${SRVROOT}/conf/mime.types"
AddType application/javascript .mjs
AddType application/wasm .wasm
DirectoryIndex index.php index.html index.htm
AccessFileName .htaccess

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# The document root is often the project root: never serve version-control metadata, secrets
# (`.env*`), git files (`.gitignore`, the `.git` file of a worktree), logs, SQL dumps or
# backups. Case-insensitive because NTFS is; `/.well-known/` is not matched. These sections
# merge after every <Directory> and `.htaccess`, but before <Location> and <If>: each site's
# vhost repeats the denial in a final <If> that nothing merges after (vhost.conf.j2).
# Apache matches directories with `/` separators on Windows too.
<DirectoryMatch "(?i)/\.(git|svn|hg)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(?i)^\.(env|git)|\.(log|sql|bak)$">
    Require all denied
</FilesMatch>

# PHP through mod_fcgid: php-cgi.exe processes are spawned on the first request of a site and
# reaped when idle, so an idle Lampo costs almost no RAM.
FcgidMaxProcesses 64
FcgidMaxProcessesPerClass 8
FcgidMinProcessesPerClass 0
FcgidIdleTimeout 120
FcgidIdleScanInterval 30
FcgidProcessLifeTime 3600
FcgidMaxRequestsPerProcess 1000
# Long Xdebug step-debugging sessions and slow scripts must not be cut off.
FcgidIOTimeout 3600
FcgidBusyTimeout 3600
# Windows only: time to connect to a freshly spawned php-cgi (cold start + antivirus scan).
FcgidConnectTimeout 20
FcgidMaxRequestLen 1073741824
FcgidMaxRequestInMem 1048576

# Catch-all for host names no site claims: the first, so default, vhost of every listened
# address. On a dedicated port it refuses foreign Host headers (DNS rebinding). Its name never
# resolves, so `localhost` and `127.0.0.1` stay free for the site of a dedicated port.
<VirtualHost 127.0.0.1:80 [::1]:80 127.0.0.1:8080 127.0.0.1:8101>
    ServerName catch-all.lampo.invalid
    DocumentRoot "${SRVROOT}/htdocs"
    RewriteEngine On
    RewriteRule ^ - [R=404,L]
    ErrorDocument 404 "Lampo: no site is configured for this host name."
</VirtualHost>

IncludeOptional "${LAMPO_VHOSTS}"
