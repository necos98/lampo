[package]
name = "lampo-application"
description = "Lampo use cases and the serde DTOs/control protocol exposed to front-ends (GUI, CLI). Depends only on lampo-domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lampo-domain = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
# `sync`/`time` primitives (task registry, timeouts), `join!`, and the blocking pool that keeps
# the synchronous ports off the runtime's workers (`crate::blocking`); no IO of its own.
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
# `join_all` to query the package catalog sources concurrently.
futures-util = { workspace = true }

[dev-dependencies]
# Generates the desktop app's `bindings.ts` from the DTOs in a test (the derives are
# `cfg_attr(test)`): the release binaries never link it.
ts-rs = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
